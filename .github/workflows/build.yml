name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: "dist/*.exe"
          - os: macos-latest
            platform: mac
            artifact: "dist/*.dmg"
          - os: ubuntu-latest
            platform: linux
            artifact: "dist/*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate PNG icon from SVG (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y librsvg2-bin
          else
            brew install librsvg
          fi
          rsvg-convert -w 1024 -h 1024 build/icon.svg -o build/icon.png

      - name: Generate PNG icon from SVG (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svg = Get-Content build/icon.svg -Raw
          # electron-builder will use icon.svg fallback path if png is missing,
          # so we generate via Inkscape if available, else skip (builder handles SVG on Windows)
          if (Get-Command inkscape -ErrorAction SilentlyContinue) {
            inkscape --export-type=png --export-width=1024 --export-height=1024 --export-filename=build/icon.png build/icon.svg
          }

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: PromptForge-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: "PromptForge AI ${{ github.ref_name }}"
          body: |
            ## PromptForge AI ${{ github.ref_name }}
            Download the app for your platform:
            | Platform | Download |
            |----------|---------|
            | 🪟 Windows | `PromptForge-AI-Setup-x64.exe` |
            | 🍎 macOS | `PromptForge-AI-universal.dmg` |
            | 🐧 Linux | `PromptForge-AI-x64.AppImage` |
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

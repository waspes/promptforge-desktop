name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: "dist/*.exe"
          - os: macos-latest
            platform: mac
            artifact: "dist/*.dmg"
          - os: ubuntu-latest
            platform: linux
            artifact: "dist/*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: Waspes-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: "Waspes ${{ github.ref_name }}"
          body: |
            ## Waspes ${{ github.ref_name }}
            Download the app for your platform:
            | Platform | Download |
            |----------|---------|
            | 🪟 Windows | `Waspes-Setup-x64.exe` |
            | 🍎 macOS | `Waspes-universal.dmg` |
            | 🐧 Linux | `Waspes-x64.AppImage` |
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
